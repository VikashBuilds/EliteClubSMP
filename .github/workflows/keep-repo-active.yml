name: Keep Repo Active

on:
  schedule:
    # Runs every 20 days (prevents GitHub from disabling scheduled workflows after 60 days of inactivity)
    - cron: '0 0 1,21 * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Update activity timestamp
        run: |
          mkdir -p .github
          echo "Last active: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .github/last-active.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/last-active.txt
          git diff --quiet --cached || git commit -m "chore: keep repo active [skip ci]"
          git push
