name: Minecraft Server 24/7 (14GB macOS)

on:
  workflow_dispatch:
  schedule:
    # Backup cron every 6 hours in case chain breaks
    - cron: '0 */6 * * *'

concurrency:
  group: minecraft-server
  cancel-in-progress: false

jobs:
  run-minecraft:
    runs-on: macos-latest
    timeout-minutes: 360  # 6 hours max

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install AWS CLI & Utilities
        run: |
          brew install awscli jq filebrowser || true
          chmod +x scripts/*.sh

      - name: Restore World & Server Files from Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          bash scripts/restore.sh

      - name: Prepare Server Config & Plugins
        run: |
          echo "📦 Preparing server configuration..."

          # Accept EULA
          echo "eula=true" > eula.txt

          # Copy server.properties to working directory
          cp -f server.properties server.properties 2>/dev/null || true

          # Create plugins directory
          mkdir -p plugins

          # Download playit.gg Minecraft Plugin (Java-based, works on any OS)
          # This replaces the native playit agent that has no macOS ARM64 build
          # Using direct GitHub releases URL (Hangar API redirects to this same file)
          echo "📥 Downloading playit.gg Minecraft Plugin v0.2.0..."
          PLAYIT_PLUGIN_URL="https://github.com/playit-cloud/playit-minecraft-plugin/releases/download/v0.2.0/playit-minecraft-plugin.jar"
          curl -sL -o plugins/playit-minecraft-plugin.jar "$PLAYIT_PLUGIN_URL"

          # Validate the downloaded file is actually a JAR (ZIP format starts with PK magic bytes)
          if [ -f "plugins/playit-minecraft-plugin.jar" ]; then
            FILE_HEAD=$(xxd -l 2 -p plugins/playit-minecraft-plugin.jar 2>/dev/null || echo "0000")
            FILE_SIZE=$(stat -f%z plugins/playit-minecraft-plugin.jar 2>/dev/null || stat -c%s plugins/playit-minecraft-plugin.jar 2>/dev/null || echo "0")

            if [ "$FILE_HEAD" = "504b" ] && [ "$FILE_SIZE" -gt 100000 ]; then
              echo "✅ playit.gg plugin downloaded and validated ($(du -h plugins/playit-minecraft-plugin.jar | cut -f1))"
            else
              echo "❌ Downloaded file is NOT a valid JAR (size: ${FILE_SIZE}, magic: ${FILE_HEAD})"
              echo "   Removing corrupted file..."
              rm -f plugins/playit-minecraft-plugin.jar
              echo "   ⚠️ Server will start without playit tunnel. You can manually upload the plugin via File Manager."
            fi
          else
            echo "❌ Download failed. Server will start without tunnel."
          fi

          echo "✅ Server configuration ready!"

      - name: Start Web File Manager (Filebrowser on Port 8080)
        run: |
          echo "📁 Launching Web File Manager..."
          filebrowser -a 0.0.0.0 -p 8080 -r . --username admin --password admin123 &
          sleep 3
          echo "✅ Web File Manager running on port 8080 (user: admin / pass: admin123)"

      - name: Start Cloudflare Tunnel (HTTP only — for Web File Manager)
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          echo "🔗 Setting up Cloudflare Tunnel (HTTP File Manager only)..."

          if [ -n "$CLOUDFLARE_TUNNEL_TOKEN" ]; then
            echo "🌐 Starting Cloudflare Named Tunnel → files.vikashbuilds.in"
            brew install cloudflared || true
            cloudflared tunnel run --token "$CLOUDFLARE_TUNNEL_TOKEN" &
            sleep 5
            echo "✅ Cloudflare Tunnel active for files.vikashbuilds.in (HTTP → localhost:8080)"
          else
            echo "⚠️ No CLOUDFLARE_TUNNEL_TOKEN set. Web File Manager only accessible locally."
          fi

          echo ""
          echo "╔══════════════════════════════════════════════════════════════════╗"
          echo "║  ⚠️  IMPORTANT: Cloudflare Tunnel does NOT support Minecraft!   ║"
          echo "║  Minecraft uses raw TCP — Cloudflare only proxies HTTP/HTTPS.   ║"
          echo "║  The playit.gg plugin handles Minecraft connections instead.    ║"
          echo "╚══════════════════════════════════════════════════════════════════╝"

      - name: Launch Server & Auto-Sync Loop (5 Hours 30 Minutes)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          echo "🚀 Starting Minecraft Server with 12GB Heap..."
          bash scripts/start-server.sh &
          SERVER_PID=$!

          # Wait for server to fully start (world gen + plugins load)
          echo "⏳ Waiting 60 seconds for server + playit plugin to initialize..."
          sleep 60

          # Print playit.gg connection info from plugin logs
          echo ""
          echo "╔══════════════════════════════════════════════════════════════════╗"
          echo "║  🎮 MINECRAFT SERVER CONNECTION INFO                            ║"
          echo "╠══════════════════════════════════════════════════════════════════╣"

          # Check if playit plugin generated a claim link or tunnel address
          if [ -f "logs/latest.log" ]; then
            echo "║  📋 Checking playit.gg plugin logs for connection address...    ║"
            PLAYIT_LINK=$(grep -i "playit" logs/latest.log | grep -oE "https?://[^ ]+" | head -1 || true)
            PLAYIT_ADDR=$(grep -i "tunnel\|address\|playit" logs/latest.log | tail -5 || true)

            if [ -n "$PLAYIT_LINK" ]; then
              echo "║  🔗 Claim Link: $PLAYIT_LINK"
            fi
            if [ -n "$PLAYIT_ADDR" ]; then
              echo "║  📡 Tunnel Logs:"
              echo "$PLAYIT_ADDR" | while IFS= read -r line; do
                echo "║     $line"
              done
            fi
          else
            echo "║  ⚠️ Server log not found yet. Check GitHub Actions live log.    ║"
          fi

          echo "║                                                                  ║"
          echo "║  📂 File Manager: https://files.vikashbuilds.in                  ║"
          echo "║     Login: admin / admin123                                       ║"
          echo "╚══════════════════════════════════════════════════════════════════╝"
          echo ""

          # Periodic backup every 30 minutes while server runs
          RUNTIME=19800  # 5 hours 30 minutes
          ELAPSED=0
          BACKUP_INTERVAL=1800  # 30 minutes

          while [ $ELAPSED -lt $RUNTIME ]; do
            sleep $BACKUP_INTERVAL
            ELAPSED=$((ELAPSED + BACKUP_INTERVAL))
            HOURS=$((ELAPSED / 3600))
            MINS=$(((ELAPSED % 3600) / 60))
            echo "⏰ Uptime: ${HOURS}h ${MINS}m — Performing 30-minute incremental R2 backup..."
            bash scripts/backup.sh || echo "⚠️ Background backup warning."
          done

          echo "⚠️ 5 hours 30 minutes reached. Initiating graceful server shutdown..."
          echo "stop" > /tmp/mc_cmd 2>/dev/null || kill -SIGTERM $SERVER_PID 2>/dev/null || true
          sleep 15

          echo "📦 Performing final world upload to Cloudflare R2..."
          bash scripts/backup.sh

          echo "✅ Graceful shutdown completed!"

      - name: Trigger Next Run (Infinite 24/7 Chain)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "🔄 Triggering next workflow run..."
          for attempt in 1 2 3; do
            if gh workflow run minecraft.yml --repo ${{ github.repository }}; then
              echo "✅ Next Minecraft run triggered successfully!"
              exit 0
            fi
            echo "⚠️ Retry $attempt failed. Retrying in 10 seconds..."
            sleep 10
          done
          echo "❌ Infinite trigger failed after 3 attempts. Backup cron will restart within 6 hours."
