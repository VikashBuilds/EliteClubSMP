name: Minecraft Server 24/7 (14GB macOS)

on:
  workflow_dispatch:
  schedule:
    # Backup cron every 6 hours in case chain breaks
    - cron: '0 */6 * * *'

concurrency:
  group: minecraft-server
  cancel-in-progress: false

jobs:
  run-minecraft:
    runs-on: macos-latest
    timeout-minutes: 360  # 6 hours max

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install AWS CLI & Utilities
        run: |
          brew install awscli jq filebrowser || true
          chmod +x scripts/*.sh

      - name: Restore World & Server Files from Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          bash scripts/restore.sh

      - name: Enable SFTP & OpenSSH Server
        env:
          SFTP_PASS: ${{ secrets.SFTP_PASSWORD }}
        run: |
          echo "🔐 Setting up OpenSSH / SFTP Server..."
          PASS="${SFTP_PASS:-Vikash@0436}"
          
          # Set password for current runner user
          sudo dscl . -passwd /Users/$USER "$PASS" || true
          echo "$USER:$PASS" | sudo chpasswd || true

          # Enable SSH service
          sudo systemsetup -setremotelogin on || true
          sudo launchctl load -w /System/Library/LaunchDaemons/ssh.plist 2>/dev/null || true
          echo "✅ SFTP/SSH service enabled for user: $USER"

      - name: Start Web File Manager (Filebrowser on Port 8080)
        run: |
          echo "📁 Installing & Launching Web File Manager..."
          brew install filebrowser || curl -fsSL https://raw.githubusercontent.com/filebrowser/get/master/get.sh | bash || true
          
          # Launch filebrowser serving current server directory on port 8080
          filebrowser -a 0.0.0.0 -p 8080 -r . --username admin --password admin123 &
          sleep 3
          echo "✅ Web File Manager running on port 8080 (user: admin / pass: admin123)"

      - name: Start Cloudflare Tunnel & playit.gg Tunnel
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          PLAYIT_SECRET_KEY: ${{ secrets.PLAYIT_SECRET_KEY }}
        run: |
          echo "🔗 Setting up Network Tunnels..."
          
          # 1. Cloudflare Named Tunnel (if token provided)
          if [ -n "$CLOUDFLARE_TUNNEL_TOKEN" ]; then
            echo "🌐 Starting Cloudflare Named Tunnel (mc.vikashbuilds.in)..."
            brew install cloudflared || true
            cloudflared tunnel run --token "$CLOUDFLARE_TUNNEL_TOKEN" &
          fi

          # 2. playit.gg TCP Tunnel (Direct TCP proxy for Minecraft 25565 & SFTP 22)
          if [ -n "$PLAYIT_SECRET_KEY" ]; then
            echo "⚡ Starting playit.gg TCP & SFTP Tunnel..."
            curl -sL https://playit.gg/downloads/playit-0.15.26-x86_64-apple-darwin.tar.gz -o playit.tar.gz
            tar -xzf playit.tar.gz
            chmod +x playit
            ./playit --secret "$PLAYIT_SECRET_KEY" &
          fi

          sleep 5
          echo "✅ Tunnel setup complete!"

      - name: Launch Server & Auto-Sync Loop (5 Hours 30 Minutes)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          echo "🚀 Starting Minecraft Server with 12GB Heap..."
          bash scripts/start-server.sh &
          SERVER_PID=$!

          # Wait for server to start
          sleep 30

          # Periodic backup every 30 minutes while server runs
          RUNTIME=19800  # 5 hours 30 minutes
          ELAPSED=0
          BACKUP_INTERVAL=1800  # 30 minutes

          while [ $ELAPSED -lt $RUNTIME ]; do
            sleep $BACKUP_INTERVAL
            ELAPSED=$((ELAPSED + BACKUP_INTERVAL))
            HOURS=$((ELAPSED / 3600))
            MINS=$(((ELAPSED % 3600) / 60))
            echo "⏰ Uptime: ${HOURS}h ${MINS}m — Performing 30-minute incremental R2 backup..."
            bash scripts/backup.sh || echo "⚠️ Background backup warning."
          done

          echo "⚠️ 5 hours 30 minutes reached. Initiating graceful server shutdown..."
          echo "stop" > /tmp/mc_cmd 2>/dev/null || kill -SIGTERM $SERVER_PID 2>/dev/null || true
          sleep 15

          echo "📦 Performing final world upload to Cloudflare R2..."
          bash scripts/backup.sh

          echo "✅ Graceful shutdown completed!"

      - name: Trigger Next Run (Infinite 24/7 Chain)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "🔄 Triggering next workflow run..."
          for attempt in 1 2 3; do
            if gh workflow run minecraft.yml --repo ${{ github.repository }}; then
              echo "✅ Next Minecraft run triggered successfully!"
              exit 0
            fi
            echo "⚠️ Retry $attempt failed. Retrying in 10 seconds..."
            sleep 10
          done
          echo "❌ Infinite trigger failed after 3 attempts. Backup cron will restart within 6 hours."
