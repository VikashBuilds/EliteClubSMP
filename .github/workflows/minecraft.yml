name: Minecraft Server 24/7 (14GB macOS)

on:
  workflow_dispatch:
  schedule:
    # Backup cron every 6 hours in case chain breaks
    - cron: '0 */6 * * *'

concurrency:
  group: minecraft-server
  cancel-in-progress: false

jobs:
  run-minecraft:
    runs-on: macos-latest
    timeout-minutes: 360  # 6 hours max

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Tools (AWS CLI, bore, filebrowser)
        run: |
          brew install awscli jq bore-cli filebrowser || true
          chmod +x scripts/*.sh

      - name: Restore World & Server Files from Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          bash scripts/restore.sh

      - name: Prepare Server Config & Plugins
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          echo "📦 Preparing server configuration..."

          # Accept EULA
          echo "eula=true" > eula.txt

          # Create plugins directory
          mkdir -p plugins

          # Download playit.gg Minecraft Plugin (Java-based, works on any OS)
          echo "📥 Downloading playit.gg Minecraft Plugin v0.2.0..."
          PLAYIT_PLUGIN_URL="https://github.com/playit-cloud/playit-minecraft-plugin/releases/download/v0.2.0/playit-minecraft-plugin.jar"
          curl -sL -o plugins/playit-minecraft-plugin.jar "$PLAYIT_PLUGIN_URL"

          # Validate the downloaded file is actually a JAR (ZIP format starts with PK magic bytes)
          if [ -f "plugins/playit-minecraft-plugin.jar" ]; then
            FILE_HEAD=$(xxd -l 2 -p plugins/playit-minecraft-plugin.jar 2>/dev/null || echo "0000")
            FILE_SIZE=$(stat -f%z plugins/playit-minecraft-plugin.jar 2>/dev/null || stat -c%s plugins/playit-minecraft-plugin.jar 2>/dev/null || echo "0")

            if [ "$FILE_HEAD" = "504b" ] && [ "$FILE_SIZE" -gt 100000 ]; then
              echo "✅ playit.gg plugin downloaded and validated ($(du -h plugins/playit-minecraft-plugin.jar | cut -f1))"
            else
              echo "❌ Downloaded file is NOT a valid JAR (size: ${FILE_SIZE}, magic: ${FILE_HEAD})"
              rm -f plugins/playit-minecraft-plugin.jar
              echo "   ⚠️ Server will start without playit tunnel."
            fi
          else
            echo "❌ Download failed. Server will start without tunnel."
          fi

          # ━━━ Pre-write playit.gg secret key so you don't have to claim every run ━━━
          mkdir -p plugins/playit-gg
          if [ -n "$PLAYIT_SECRET" ]; then
            echo "🔑 Writing saved playit.gg secret key to plugin config..."
            echo "# playit.gg plugin config — auto-generated" > plugins/playit-gg/config.yml
            echo "agent-secret: \"$PLAYIT_SECRET\"" >> plugins/playit-gg/config.yml
            echo "✅ playit.gg secret key restored — NO claim needed this run!"
          else
            echo ""
            echo "╔══════════════════════════════════════════════════════════════════╗"
            echo "║  ⚠️  PLAYIT_SECRET not set — you will need to claim this run!  ║"
            echo "║                                                                  ║"
            echo "║  FIRST TIME SETUP:                                               ║"
            echo "║  1. Let the server start and look for the claim link in logs     ║"
            echo "║  2. Visit the https://playit.gg/claim/XXXXX link                 ║"
            echo "║  3. After claiming, find the secret key in server logs:           ║"
            echo "║     Look for: 'secret key set to: XXXXXXXX'                      ║"
            echo "║     OR check: plugins/playit-gg/config.yml on the server         ║"
            echo "║  4. Copy the agent-secret value                                  ║"
            echo "║  5. Go to GitHub repo → Settings → Secrets → Actions             ║"
            echo "║  6. Add secret: PLAYIT_SECRET = (the value you copied)           ║"
            echo "║  7. All future runs will auto-connect — no more claiming!        ║"
            echo "║                                                                  ║"
            echo "╚══════════════════════════════════════════════════════════════════╝"
            echo ""
          fi

          echo "✅ Server configuration ready!"

      - name: Setup SFTP / SSH Server (Permanent Key)
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          echo "🔐 Setting up SSH/SFTP Server..."
          SERVER_DIR="$(pwd)"

          # ━━━ Step 1: Add your permanent public key to authorized_keys ━━━
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -n "$SSH_PUBLIC_KEY" ]; then
            echo "$SSH_PUBLIC_KEY" > ~/.ssh/authorized_keys
            chmod 600 ~/.ssh/authorized_keys
            echo "  ✅ Your permanent SSH public key loaded from GitHub Secrets"
          else
            echo ""
            echo "╔══════════════════════════════════════════════════════════════════╗"
            echo "║  ❌ SSH_PUBLIC_KEY secret not set — SFTP will NOT work!         ║"
            echo "║                                                                  ║"
            echo "║  ONE-TIME SETUP:                                                 ║"
            echo "║  1. Go to: GitHub Repo → Settings → Secrets → Actions            ║"
            echo "║  2. Add secret: SSH_PUBLIC_KEY                                   ║"
            echo "║  3. Value: (your public key — check logs for value)              ║"
            echo "║  4. All runs will use the SAME key — FileZilla works forever!   ║"
            echo "╚══════════════════════════════════════════════════════════════════╝"
            echo ""
          fi

          # ━━━ Step 2: Configure sshd for KEY-ONLY auth ━━━
          echo "  → Configuring SSH daemon for key-only auth..."
          SSHD_CONFIG="/etc/ssh/sshd_config"
          sudo cp "$SSHD_CONFIG" "${SSHD_CONFIG}.bak" 2>/dev/null || true

          # Write a clean sshd config that forces key-only auth
          printf '%s\n' \
            "# SSH Server Config — Minecraft SFTP (key-only auth)" \
            "Port 22" \
            "HostKey /etc/ssh/ssh_host_ed25519_key" \
            "HostKey /etc/ssh/ssh_host_rsa_key" \
            "" \
            "# Force key-based auth ONLY (fixes FileZilla keyboard-interactive error)" \
            "PubkeyAuthentication yes" \
            "AuthorizedKeysFile .ssh/authorized_keys" \
            "PasswordAuthentication no" \
            "ChallengeResponseAuthentication no" \
            "KbdInteractiveAuthentication no" \
            "UsePAM no" \
            "" \
            "# Allow SFTP" \
            "Subsystem sftp /usr/libexec/sftp-server" \
            "" \
            "LogLevel INFO" \
            | sudo tee "$SSHD_CONFIG" > /dev/null

          # Generate host keys if missing
          sudo ssh-keygen -A 2>/dev/null || true

          # ━━━ Step 3: Start SSH service ━━━
          sudo systemsetup -setremotelogin on 2>/dev/null || true
          sudo launchctl stop com.openssh.sshd 2>/dev/null || true
          sleep 1
          sudo launchctl start com.openssh.sshd 2>/dev/null || true
          sudo launchctl load -w /System/Library/LaunchDaemons/ssh.plist 2>/dev/null || true
          sleep 2

          # If launchctl didn't work, start sshd manually
          if ! sudo lsof -i :22 2>/dev/null | grep -q LISTEN; then
            echo "  → Starting sshd manually..."
            sudo /usr/sbin/sshd
            sleep 2
          fi

          # Verify SSH is running
          if sudo lsof -i :22 2>/dev/null | grep -q LISTEN; then
            echo "  ✅ SSH/SFTP server is RUNNING on port 22 (key-only auth)"
          else
            echo "  ❌ SSH failed to start!"
            exit 1
          fi

          # ━━━ Step 4: Self-test SSH connection ━━━
          if [ -n "$SSH_PUBLIC_KEY" ]; then
            echo "  → Testing SSH connection locally..."
            # Create a temporary key for testing (matching the public key is already in authorized_keys)
            ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 -o BatchMode=yes $USER@localhost echo "SSH_TEST_OK" 2>/dev/null && echo "  ✅ SSH self-test PASSED" || echo "  ⚠️ SSH self-test: key auth not verified locally (will work via tunnel)"
          fi

          echo "  ✅ SFTP ready! User: $USER | Dir: $SERVER_DIR"

      - name: Start SFTP Tunnel (bore → FileZilla)
        run: |
          echo "🌐 Starting TCP tunnel for SFTP (port 22)..."
          SERVER_DIR="$(pwd)"

          # Start bore TCP tunnel for port 22 (SFTP/SSH)
          bore local 22 --to bore.pub > /tmp/bore_sftp.log 2>&1 &
          BORE_PID=$!

          # Wait and retry reading the port (bore can be slow to connect)
          BORE_SFTP_PORT=""
          for attempt in 1 2 3 4 5 6; do
            sleep 5
            BORE_SFTP_PORT=$(grep -oE "bore\.pub:[0-9]+" /tmp/bore_sftp.log | head -1 | cut -d: -f2 || true)
            if [ -n "$BORE_SFTP_PORT" ]; then
              break
            fi
            echo "  ⏳ Waiting for bore tunnel (attempt $attempt/6)..."
          done

          if [ -n "$BORE_SFTP_PORT" ]; then
            echo ""
            echo "╔══════════════════════════════════════════════════════════════════╗"
            echo "║  📂 SFTP / FileZilla Connection Details                         ║"
            echo "╠══════════════════════════════════════════════════════════════════╣"
            echo "║                                                                  ║"
            echo "║  Protocol:   SFTP - SSH File Transfer Protocol                   ║"
            echo "║  Host:       bore.pub                                            ║"
            echo "║  Port:       $BORE_SFTP_PORT"
            echo "║  Username:   runner"
            echo "║  Logon Type: Key file                                            ║"
            echo "║  Key File:   Desktop/mc_sftp_key                                 ║"
            echo "║                                                                  ║"
            echo "║  📋 FileZilla Setup:                                              ║"
            echo "║  1. Edit → Settings → SFTP → Add key file → mc_sftp_key         ║"
            echo "║  2. Host: bore.pub  Port: $BORE_SFTP_PORT  User: runner"
            echo "║  3. Logon Type: Normal (key already imported) → Quickconnect     ║"
            echo "║                                                                  ║"
            echo "║  Server Directory: $SERVER_DIR"
            echo "║                                                                  ║"
            echo "╚══════════════════════════════════════════════════════════════════╝"
            echo ""

            echo "BORE_SFTP_HOST=bore.pub" > /tmp/sftp_info.txt
            echo "BORE_SFTP_PORT=$BORE_SFTP_PORT" >> /tmp/sftp_info.txt
            echo "BORE_SFTP_USER=runner" >> /tmp/sftp_info.txt
          else
            echo "⚠️ bore tunnel failed to start. Full log:"
            cat /tmp/bore_sftp.log || true
            echo ""
            echo "The SFTP tunnel will keep retrying in the background."
          fi

      - name: Start Web Console + File Manager + Cloudflare Tunnel
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          SERVER_DIR="$(pwd)"

          # ━━━ Start Web File Manager (port 8080) ━━━
          echo "--- Starting Web File Manager on port 8080..."
          filebrowser -a 0.0.0.0 -p 8080 -r . --username admin --password admin123 &
          sleep 2

          # ━━━ Start Minecraft Web Console (port 8081) ━━━
          echo "--- Starting Minecraft Web Console on port 8081..."
          MC_PIPE="/tmp/mc_cmd" MC_LOG="$SERVER_DIR/logs/latest.log" CONSOLE_PASSWORD="admin123" \
            python3 scripts/web-console.py &
          sleep 2
          echo "  Console running: http://localhost:8081 (password: admin123)"

          # ━━━ Start Cloudflare Tunnel ━━━
          if [ -n "$CLOUDFLARE_TUNNEL_TOKEN" ]; then
            echo "--- Starting Cloudflare Tunnel..."
            brew install cloudflared 2>/dev/null || true
            cloudflared tunnel run --token "$CLOUDFLARE_TUNNEL_TOKEN" &
            sleep 5
            echo "  Cloudflare Tunnel started (files.vikashbuilds.in -> localhost:8080)"
          fi

          # ━━━ Start bore tunnel for Web Console (port 8081) ━━━
          echo "--- Starting bore tunnel for Web Console..."
          bore local 8081 --to bore.pub > /tmp/bore_console.log 2>&1 &

          CONSOLE_PORT=""
          for attempt in 1 2 3 4 5 6; do
            sleep 5
            CONSOLE_PORT=$(grep -oE "bore\.pub:[0-9]+" /tmp/bore_console.log | head -1 | cut -d: -f2 || true)
            if [ -n "$CONSOLE_PORT" ]; then
              break
            fi
            echo "  Waiting for console tunnel (attempt $attempt/6)..."
          done

          if [ -n "$CONSOLE_PORT" ]; then
            echo ""
            echo "========================================================"
            echo "  MINECRAFT WEB CONSOLE"
            echo "========================================================"
            echo "  URL:      http://bore.pub:$CONSOLE_PORT"
            echo "  Password: admin123"
            echo ""
            echo "  Features:"
            echo "  - Live server logs"
            echo "  - Send console commands (say, op, gamemode, etc.)"
            echo "  - Quick command buttons"
            echo "========================================================"
            echo ""
            echo "CONSOLE_URL=http://bore.pub:$CONSOLE_PORT" > /tmp/console_info.txt
          else
            echo "  Console tunnel failed. Log:"
            cat /tmp/bore_console.log || true
          fi

      - name: Launch Minecraft Server & Auto-Backup Loop (5h 30m)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          echo "🚀 Starting Minecraft Server with 12GB Heap..."
          bash scripts/start-server.sh &
          SERVER_PID=$!

          # Wait for server + plugins to load
          echo "⏳ Waiting 60 seconds for server to initialize..."
          sleep 60

          # ━━━ Print ALL connection info ━━━
          echo ""
          echo "╔══════════════════════════════════════════════════════════════════╗"
          echo "║  🎮 ALL SERVER CONNECTION INFO                                  ║"
          echo "╠══════════════════════════════════════════════════════════════════╣"

          # SFTP Info
          if [ -f "/tmp/sftp_info.txt" ]; then
            source /tmp/sftp_info.txt
            echo "║                                                                  ║"
            echo "║  📂 SFTP (FileZilla — Key-Based Auth):                           ║"
            echo "║     Host: bore.pub   Port: $BORE_SFTP_PORT"
            echo "║     User: $BORE_SFTP_USER   Auth: SSH Key (from Setup step)"
          fi

          # Minecraft / playit.gg Info
          if [ -f "logs/latest.log" ]; then
            PLAYIT_LINK=$(grep -i "playit" logs/latest.log | grep -oE "https?://[^ ]+" | head -1 || true)
            PLAYIT_ADDR=$(grep -i "tunnel\|address\|\.ply\.gg" logs/latest.log | tail -3 || true)
            if [ -n "$PLAYIT_LINK" ]; then
              echo "║                                                                  ║"
              echo "║  🎮 Minecraft (playit.gg):                                       ║"
              echo "║     Claim: $PLAYIT_LINK"
            fi
            if [ -n "$PLAYIT_ADDR" ]; then
              echo "$PLAYIT_ADDR" | while IFS= read -r line; do
                echo "║     $line"
              done
            fi
          fi

          # ━━━ Print playit secret key for first-time setup ━━━
          if [ -f "plugins/playit-gg/config.yml" ]; then
            AGENT_SECRET=$(grep "agent-secret" plugins/playit-gg/config.yml | sed 's/.*: *"\?\([^"]*\)"\?/\1/' || true)
            if [ -n "$AGENT_SECRET" ]; then
              echo "║                                                                  ║"
              echo "║  🔑 PLAYIT SECRET KEY (save this as GitHub Secret!):             ║"
              echo "║     $AGENT_SECRET"
              echo "║                                                                  ║"
              echo "║  → Go to: GitHub Repo → Settings → Secrets → Actions             ║"
              echo "║  → Add:   PLAYIT_SECRET = $AGENT_SECRET"
              echo "║  → Then all future runs auto-connect (no claim needed!)          ║"
            fi
          fi

          # Web Console Info
          if [ -f "/tmp/console_info.txt" ]; then
            source /tmp/console_info.txt
            echo "║                                                                  ║"
            echo "║  🖥️  Web Console (send commands from browser):                    ║"
            echo "║     URL:      $CONSOLE_URL"
            echo "║     Password: admin123"
          fi

          echo "║                                                                  ║"
          echo "║  📁 Web File Manager:                                             ║"
          echo "║     URL:      https://files.vikashbuilds.in                       ║"
          echo "║     Login:    admin / admin123                                    ║"

          echo "║                                                                  ║"
          echo "╚══════════════════════════════════════════════════════════════════╝"
          echo ""

          # ━━━ Periodic backup loop ━━━
          RUNTIME=19800  # 5 hours 30 minutes
          ELAPSED=0
          BACKUP_INTERVAL=1800  # 30 minutes

          while [ $ELAPSED -lt $RUNTIME ]; do
            sleep $BACKUP_INTERVAL
            ELAPSED=$((ELAPSED + BACKUP_INTERVAL))
            HOURS=$((ELAPSED / 3600))
            MINS=$(((ELAPSED % 3600) / 60))
            echo "⏰ Uptime: ${HOURS}h ${MINS}m — Performing 30-minute backup..."
            bash scripts/backup.sh || echo "⚠️ Backup warning."
          done

          echo "⚠️ 5h 30m reached. Graceful shutdown..."
          echo "stop" > /tmp/mc_cmd 2>/dev/null || kill -SIGTERM $SERVER_PID 2>/dev/null || true
          sleep 15

          echo "📦 Final backup to Cloudflare R2..."
          bash scripts/backup.sh

          echo "✅ Graceful shutdown completed!"

      - name: Trigger Next Run (Infinite 24/7 Chain)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "🔄 Triggering next workflow run..."
          for attempt in 1 2 3; do
            if gh workflow run minecraft.yml --repo ${{ github.repository }}; then
              echo "✅ Next Minecraft run triggered successfully!"
              exit 0
            fi
            echo "⚠️ Retry $attempt failed. Retrying in 10 seconds..."
            sleep 10
          done
          echo "❌ Trigger failed after 3 attempts. Backup cron will restart within 6 hours."
